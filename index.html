<script>
const DB='meu-simulado-muqui-db', STORE='questions', RESULTS='results';const SUBJECTS=['Língua Portuguesa','Informática','Conhecimentos Pedagógicos','Conhecimentos Específicos'];const WEIGHTS={'Língua Portuguesa':2.5,'Informática':2,'Conhecimentos Pedagógicos':2.5,'Conhecimentos Específicos':3};let db,tab='home',questions=[],results=[],sim=null,tick=null,elapsed=0,selected={},eliminatedOptions={};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const INITIAL_QUESTIONS = [
// LÍNGUA PORTUGUESA (10)
{subject:'Língua Portuguesa',topic:'Interpretação de texto',text:'Leia: “A leitura diária amplia o vocabulário e oferece à criança oportunidades de imaginar, perguntar e construir sentidos.” A ideia central do trecho é que a leitura:',options:['serve apenas para ensinar letras e sílabas.','contribui para diferentes dimensões do desenvolvimento infantil.','deve ocorrer somente quando a criança já sabe ler.','substitui as brincadeiras na Educação Infantil.'],answer:'B',comment:'O trecho associa a leitura à ampliação do vocabulário, à imaginação, à formulação de perguntas e à construção de sentidos. Portanto, destaca sua contribuição ampla ao desenvolvimento.',optionExplanations:['O texto não limita a leitura ao ensino do sistema alfabético.','Correta: reúne as várias contribuições expressamente mencionadas no trecho.','A leitura pode ser vivenciada antes da alfabetização convencional, inclusive por meio da mediação do adulto.','O texto não apresenta leitura e brincadeira como atividades excludentes.']},
{subject:'Língua Portuguesa',topic:'Coesão textual',text:'Em “A professora organizou os livros. Em seguida, ela convidou as crianças para a roda”, o pronome “ela” retoma:',options:['as crianças.','a roda.','a professora.','os livros.'],answer:'C',comment:'O pronome pessoal “ela” estabelece coesão referencial e retoma o termo feminino singular “a professora”, sujeito da ação anterior.',optionExplanations:['“Crianças” está no plural e não é o referente.','“Roda” é o destino do convite, não quem o realizou.','Correta: “ela” retoma “a professora”.','“Livros” está no plural e não corresponde ao pronome.']},
{subject:'Língua Portuguesa',topic:'Gêneros textuais',text:'Um texto que apresenta instruções sequenciais para realizar uma tarefa, como uma receita, caracteriza-se predominantemente pela tipologia:',options:['narrativa.','injuntiva ou instrucional.','descritiva.','argumentativa.'],answer:'B',comment:'A tipologia injuntiva orienta o leitor a realizar ações, geralmente por meio de instruções, comandos ou etapas.',optionExplanations:['A narrativa relata acontecimentos em sequência.','Correta: apresenta orientações para executar uma tarefa.','A descritiva caracteriza seres, objetos, ambientes ou situações.','A argumentativa defende um ponto de vista com justificativas.']},
{subject:'Língua Portuguesa',topic:'Classes de palavras',text:'Na frase “As crianças brincaram alegremente no pátio”, a palavra “alegremente” é:',options:['adjetivo.','substantivo.','advérbio.','preposição.'],answer:'C',comment:'“Alegremente” modifica o verbo “brincaram”, indicando o modo como a ação ocorreu. É, portanto, um advérbio de modo.',optionExplanations:['Adjetivo caracteriza um substantivo; aqui a palavra modifica o verbo.','Não nomeia ser, objeto ou ideia.','Correta: modifica o verbo e indica modo.','Não estabelece relação sintática como uma preposição.']},
{subject:'Língua Portuguesa',topic:'Concordância verbal',text:'Assinale a frase de acordo com a norma-padrão de concordância verbal.',options:['As crianças brinca no jardim.','A turma chegaram cedo.','Os professores planejaram as atividades.','Os livro estão organizados.'],answer:'C',comment:'O sujeito “os professores” está no plural e o verbo “planejaram” também. Nas demais alternativas há desacordo de número entre sujeito e verbo ou entre determinante e nome.',optionExplanations:['O sujeito plural exige “brincam”.','O núcleo “turma” está no singular: “chegou”.','Correta: sujeito e verbo estão no plural.','Além da concordância nominal incorreta, o adequado seria “os livros”.']},
{subject:'Língua Portuguesa',topic:'Crase',text:'Assinale a alternativa em que o emprego do acento indicativo de crase está correto.',options:['A professora entregou o bilhete à diretora.','As crianças começaram à brincar.','O material foi entregue à todos.','Chegaremos à partir das oito horas.'],answer:'A',comment:'O verbo “entregar” rege a preposição “a” (entregar algo a alguém) e “diretora” admite artigo feminino “a”. O encontro forma “à”. Não há crase antes de verbo, pronome indefinido masculino ou na locução “a partir”.',optionExplanations:['Correta: ocorre a fusão da preposição exigida pelo verbo com o artigo feminino.','Não se usa crase antes de verbo.','Não se usa crase antes de “todos”.','A expressão correta é “a partir”, sem crase.']},
{subject:'Língua Portuguesa',topic:'Pontuação',text:'Na frase “Ao terminar a atividade, as crianças organizaram os materiais”, a vírgula foi empregada para:',options:['separar o sujeito do predicado.','isolar uma oração adverbial deslocada para o início do período.','indicar uma pergunta indireta.','separar verbo e complemento obrigatório.'],answer:'B',comment:'“Ao terminar a atividade” é uma oração reduzida de infinitivo com valor temporal, deslocada para o início do período. A vírgula marca esse deslocamento.',optionExplanations:['Não se deve separar sujeito e predicado por vírgula.','Correta: a oração temporal aparece antes da oração principal.','A frase não contém pergunta indireta.','A vírgula não separa o verbo de seu complemento.']},
{subject:'Língua Portuguesa',topic:'Ortografia',text:'Assinale a alternativa em que todas as palavras estão grafadas corretamente.',options:['excessão, pesquisa, infância.','exceção, pesquisa, infância.','exceção, pesquiza, infância.','excessão, pesquiza, infansia.'],answer:'B',comment:'A grafia oficial é “exceção”, “pesquisa” e “infância”. As demais alternativas apresentam erros ortográficos.',optionExplanations:['“Excessão” está incorreta; o correto é “exceção”.','Correta: as três palavras estão grafadas adequadamente.','“Pesquiza” está incorreta; o correto é “pesquisa”.','As três grafias estão incorretas.']},
{subject:'Língua Portuguesa',topic:'Semântica',text:'Na frase “A professora acolheu a ideia apresentada pela turma”, a palavra “acolheu” pode ser substituída, sem alteração relevante de sentido, por:',options:['rejeitou.','ignorou.','aceitou.','esqueceu.'],answer:'C',comment:'No contexto, “acolher uma ideia” significa recebê-la favoravelmente ou aceitá-la. As demais opções expressam sentidos diferentes ou opostos.',optionExplanations:['Expressa sentido contrário.','Significa não dar atenção, diferente de acolher.','Correta: “aceitou” preserva o sentido contextual.','Não equivale a acolher uma ideia.']},
{subject:'Língua Portuguesa',topic:'Regência e colocação pronominal',text:'De acordo com a norma-padrão, assinale a frase correta.',options:['Nunca disseram-me a verdade.','Nunca me disseram a verdade.','Nunca disseram a verdade-me.','Nunca disseram eu a verdade.'],answer:'B',comment:'O advérbio “nunca” é palavra de sentido negativo e atrai o pronome oblíquo átono, exigindo próclise: “nunca me disseram”.',optionExplanations:['A palavra negativa “nunca” atrai o pronome, tornando inadequada a ênclise.','Correta: ocorre próclise por atração do termo negativo.','A posição do pronome está incorreta.','O pronome reto “eu” não exerce essa função de complemento.']},
// INFORMÁTICA (10)
{subject:'Informática',topic:'Microsoft Word 2019',text:'No Microsoft Word 2019, qual recurso permite repetir automaticamente informações, como o nome da instituição, na parte superior de várias páginas?',options:['Rodapé.','Cabeçalho.','Quebra de seção.','Pincel de formatação.'],answer:'B',comment:'O cabeçalho é a área situada na parte superior da página e pode conter informações repetidas ao longo do documento. O rodapé fica na parte inferior.',optionExplanations:['O rodapé fica na parte inferior da página.','Correta: o cabeçalho apresenta conteúdo na parte superior.','A quebra de seção divide partes do documento com configurações próprias.','O pincel copia formatação, não cria conteúdo repetido.']},
{subject:'Informática',topic:'Word - formatação',text:'No Word, o alinhamento “Justificado” tem como finalidade:',options:['alinhar o texto somente à margem esquerda.','centralizar todas as linhas.','alinhar o texto às margens esquerda e direita, ajustando os espaços entre palavras.','distribuir o texto apenas na vertical.'],answer:'C',comment:'O alinhamento justificado ajusta os espaços entre palavras para que as linhas, em regra, alcancem simultaneamente as margens esquerda e direita.',optionExplanations:['Corresponde ao alinhamento à esquerda.','Corresponde ao alinhamento centralizado.','Correta: alinha o texto às duas margens.','Não é uma modalidade de alinhamento de parágrafo.']},
{subject:'Informática',topic:'Excel - fórmulas',text:'No Excel 2019 em português, qual fórmula soma os valores das células A1 até A5?',options:['=SOMA(A1:A5)','=MÉDIA(A1-A5)','=ADICIONAR(A1;A5)','=TOTAL(A1:A5)'],answer:'A',comment:'A função SOMA adiciona valores. O operador “:” indica um intervalo contínuo de células, de A1 até A5.',optionExplanations:['Correta: soma o intervalo A1:A5.','MÉDIA calcula a média e o hífen não representa intervalo.','ADICIONAR não é o nome da função padrão para somar esse intervalo.','TOTAL não é a função padrão de soma no Excel.']},
{subject:'Informática',topic:'Excel - funções',text:'Em uma planilha, a função =MÉDIA(B2:B6) retorna:',options:['o maior valor do intervalo.','a soma dos valores do intervalo.','a média aritmética dos valores do intervalo.','a quantidade de células vazias.'],answer:'C',comment:'A função MÉDIA calcula a média aritmética dos valores numéricos informados no intervalo.',optionExplanations:['A função MÁXIMO retorna o maior valor.','A função SOMA retorna a soma.','Correta: MÉDIA calcula a média aritmética.','A função não tem essa finalidade.']},
{subject:'Informática',topic:'Excel - referências',text:'Em uma fórmula do Excel, a referência $A$1 é classificada como:',options:['referência relativa.','referência absoluta.','referência circular.','referência externa obrigatória.'],answer:'B',comment:'O cifrão fixa a coluna A e a linha 1. Ao copiar a fórmula para outra célula, a referência absoluta permanece apontando para A1.',optionExplanations:['Uma referência relativa seria A1, sem cifrões.','Correta: coluna e linha estão fixadas.','Referência circular ocorre quando uma fórmula depende do próprio resultado.','Não é a classificação indicada pelos cifrões.']},
{subject:'Informática',topic:'PowerPoint 2019',text:'No PowerPoint, a transição de slides é o efeito que ocorre:',options:['na passagem de um slide para outro.','somente durante a impressão.','ao corrigir a ortografia do texto.','quando se altera a fórmula de uma planilha.'],answer:'A',comment:'Transições controlam o efeito visual da mudança entre slides. Animações, por sua vez, são aplicadas a objetos dentro de um slide.',optionExplanations:['Correta: transição é o efeito entre slides.','Não é um recurso de impressão.','A correção ortográfica é uma ferramenta distinta.','Fórmulas são recursos de planilhas, não de transição.']},
{subject:'Informática',topic:'PowerPoint - animações',text:'Qual é a diferença principal entre animação e transição no PowerPoint?',options:['Não existe diferença entre elas.','Animação afeta objetos do slide; transição afeta a passagem entre slides.','Transição altera apenas o tamanho do arquivo.','Animação só pode ser aplicada a imagens.'],answer:'B',comment:'Animações são efeitos aplicados a elementos como textos, imagens e formas. Transições são efeitos exibidos na mudança de um slide para o seguinte.',optionExplanations:['Os recursos têm finalidades distintas.','Correta: distingue objetos internos e passagem entre slides.','Não é a finalidade de transições.','Animações também podem ser aplicadas a textos e formas.']},
{subject:'Informática',topic:'Segurança da informação',text:'Um arquivo recebido por e-mail de remetente desconhecido solicita que o usuário habilite macros. A conduta mais segura é:',options:['habilitar imediatamente para visualizar o arquivo.','encaminhar o arquivo a todos os contatos.','não habilitar macros e verificar a origem por canal confiável.','desativar o antivírus para evitar bloqueios.'],answer:'C',comment:'Arquivos e links inesperados podem conter código malicioso. Não se deve habilitar macros sem verificar a legitimidade e a necessidade do arquivo.',optionExplanations:['Habilitar macros sem verificar a origem pode executar código malicioso.','Aumenta a disseminação de possível ameaça.','Correta: recomenda cautela e verificação independente.','Desativar o antivírus reduz a proteção do equipamento.']},
{subject:'Informática',topic:'Internet e navegadores',text:'Em um navegador, um link (hiperlink) é:',options:['um recurso que permite acessar outra página, arquivo ou endereço.','um programa antivírus.','um dispositivo físico de armazenamento.','uma cópia impressa de uma página.'],answer:'A',comment:'Hiperlinks são elementos clicáveis que direcionam o usuário a outro recurso, como página, documento, seção ou endereço eletrônico.',optionExplanations:['Correta: descreve a função de um hiperlink.','Antivírus é um software de segurança.','Não é um dispositivo físico.','Impressão é uma operação diferente.']},
{subject:'Informática',topic:'Correio eletrônico',text:'Ao enviar uma mensagem eletrônica com um documento anexado, o usuário deve:',options:['informar que há anexo e conferir se o arquivo correto foi incluído.','compartilhar sua senha para permitir a abertura.','enviar o arquivo sem verificar o destinatário.','desativar a conexão com a internet.'],answer:'A',comment:'É boa prática conferir destinatários, conteúdo e anexos antes do envio, evitando exposição indevida de dados ou envio equivocado.',optionExplanations:['Correta: reduz erros e facilita a identificação do anexo.','Senhas não devem ser compartilhadas dessa forma.','É necessário conferir o destinatário antes de enviar.','A conexão é necessária para o envio da mensagem.']},
{subject:'Informática',topic:'Videoconferência',text:'Em uma reunião pelo Microsoft Teams, Zoom ou Google Meet, para reduzir ruídos quando não estiver falando, recomenda-se:',options:['manter o microfone sempre aberto.','compartilhar a senha da reunião publicamente.','silenciar o microfone e ativá-lo quando necessário.','desligar a câmera de todos os participantes.'],answer:'C',comment:'Silenciar o microfone quando não estiver falando reduz ruídos e melhora a qualidade da comunicação. O compartilhamento de links e senhas deve ser controlado.',optionExplanations:['Pode captar ruídos do ambiente.','Pode permitir acesso indevido à reunião.','Correta: é uma prática adequada de etiqueta e qualidade de áudio.','Não é uma medida necessária nem possível para todos os participantes.']},
// CONHECIMENTOS PEDAGÓGICOS (10)
{subject:'Conhecimentos Pedagógicos',topic:'Fundamentos da educação',text:'Compreender a educação como prática social significa reconhecer que ela:',options:['ocorre exclusivamente dentro da escola.','é influenciada pelo contexto histórico, cultural e social e também pode transformá-lo.','é independente das relações humanas.','tem como única finalidade transmitir informações.'],answer:'B',comment:'A educação ocorre em diferentes espaços sociais e está relacionada às condições históricas e culturais. A escola possui função específica, mas não é o único espaço educativo.',optionExplanations:['A educação também ocorre na família, comunidade, trabalho e outros espaços.','Correta: reconhece a relação recíproca entre educação e sociedade.','A educação se constitui nas relações humanas.','A formação envolve dimensões cognitivas, sociais, culturais e éticas.']},
{subject:'Conhecimentos Pedagógicos',topic:'Tendências pedagógicas',text:'Uma prática que parte do diálogo, da problematização da realidade e da conscientização dos educandos aproxima-se da tendência:',options:['tecnicista.','tradicional.','libertadora.','não diretiva.'],answer:'C',comment:'A tendência libertadora, associada a Paulo Freire, valoriza diálogo, problematização, leitura crítica do mundo e participação dos sujeitos.',optionExplanations:['A tecnicista enfatiza eficiência, técnicas e objetivos operacionais.','A tradicional prioriza transmissão e centralidade docente.','Correta: diálogo e problematização são características centrais.','A não diretiva enfatiza facilitação e desenvolvimento pessoal.']},
{subject:'Conhecimentos Pedagógicos',topic:'Piaget',text:'Para Jean Piaget, a assimilação ocorre quando a criança:',options:['incorpora uma nova experiência a esquemas que já possui.','abandona toda forma de conhecimento anterior.','recebe passivamente informações sem agir sobre o meio.','memoriza conteúdos sem reorganizar o pensamento.'],answer:'A',comment:'Assimilação é a incorporação de elementos da experiência aos esquemas existentes. Na acomodação, os esquemas são modificados para responder a novas exigências.',optionExplanations:['Correta: descreve a incorporação da experiência a esquemas existentes.','Não define assimilação.','Piaget destaca a atividade do sujeito na construção do conhecimento.','A teoria não reduz aprendizagem à memorização.']},
{subject:'Conhecimentos Pedagógicos',topic:'Vygotsky',text:'A Zona de Desenvolvimento Proximal, na teoria de Vygotsky, corresponde:',options:['ao conjunto de conteúdos que a criança já domina sem ajuda.','à distância entre o que a criança realiza sozinha e o que consegue realizar com orientação ou colaboração.','a uma etapa fixa determinada exclusivamente pela idade.','à ausência de interação social na aprendizagem.'],answer:'B',comment:'A ZDP indica possibilidades de desenvolvimento que se manifestam com mediação, orientação ou colaboração, além do desempenho independente atual.',optionExplanations:['Refere-se ao nível de desenvolvimento real, não à ZDP inteira.','Correta: apresenta a relação entre desempenho independente e assistido.','Não é uma etapa rígida definida apenas pela idade.','A interação social é central na perspectiva histórico-cultural.']},
{subject:'Conhecimentos Pedagógicos',topic:'Paulo Freire',text:'Na perspectiva de Paulo Freire, uma educação problematizadora caracteriza-se por:',options:['diálogo e reflexão crítica sobre a realidade.','memorização mecânica como único caminho.','silenciamento das experiências dos educandos.','transmissão unilateral sem questionamento.'],answer:'A',comment:'A educação problematizadora reconhece os educandos como sujeitos, valoriza o diálogo e promove reflexão crítica sobre o mundo e sua transformação.',optionExplanations:['Correta: diálogo e criticidade são princípios freireanos.','Freire critica a educação bancária e a memorização passiva.','A experiência e a palavra dos educandos devem ser consideradas.','A relação pedagógica não se limita à transmissão unilateral.']},
{subject:'Conhecimentos Pedagógicos',topic:'LDB',text:'De acordo com a LDB, a Educação Básica é formada por:',options:['Educação Infantil, Ensino Fundamental e Ensino Médio.','Creche, graduação e pós-graduação.','Ensino Fundamental e Ensino Superior apenas.','Educação Infantil e Ensino Superior.'],answer:'A',comment:'O art. 21 da Lei nº 9.394/1996 estabelece que a Educação Básica é formada pela Educação Infantil, Ensino Fundamental e Ensino Médio.',optionExplanations:['Correta: corresponde às três etapas da Educação Básica.','Graduação e pós-graduação integram a Educação Superior.','O Ensino Médio também integra a Educação Básica.','O Ensino Fundamental e o Ensino Médio também fazem parte da Educação Básica.']},
{subject:'Conhecimentos Pedagógicos',topic:'Gestão democrática',text:'A gestão democrática da escola pública pressupõe:',options:['decisões concentradas exclusivamente na direção.','participação dos profissionais da educação e da comunidade escolar nos processos coletivos.','ausência de planejamento institucional.','proibição de conselhos escolares.'],answer:'B',comment:'A gestão democrática envolve participação, diálogo, transparência e construção coletiva de decisões, respeitadas as normas dos sistemas de ensino.',optionExplanations:['Contraria a lógica participativa.','Correta: participação é elemento central da gestão democrática.','A gestão democrática não elimina o planejamento.','Conselhos escolares podem constituir espaços de participação.']},
{subject:'Conhecimentos Pedagógicos',topic:'Planejamento pedagógico',text:'O planejamento pedagógico é mais adequado quando:',options:['é elaborado uma única vez e nunca revisto.','desconsidera o contexto dos estudantes.','articula objetivos, conteúdos, estratégias e avaliação, sendo revisto conforme as necessidades.','se limita ao preenchimento burocrático de formulários.'],answer:'C',comment:'Planejar é organizar intencionalmente o trabalho educativo. O planejamento deve ser coerente, contextualizado, flexível e continuamente avaliado.',optionExplanations:['O planejamento precisa ser acompanhado e revisto.','Deve considerar sujeitos e contexto.','Correta: articula os elementos do processo e permite ajustes.','A dimensão burocrática não esgota sua função pedagógica.']},
{subject:'Conhecimentos Pedagógicos',topic:'Avaliação da aprendizagem',text:'A avaliação formativa tem como principal finalidade:',options:['classificar definitivamente os estudantes.','acompanhar o processo, identificar dificuldades e orientar intervenções pedagógicas.','substituir o planejamento.','ocorrer somente ao final do ano letivo.'],answer:'B',comment:'A avaliação formativa acompanha o percurso de aprendizagem e fornece informações para ajustar o ensino e apoiar o estudante durante o processo.',optionExplanations:['Classificação final se aproxima de uma função somativa, não define a formativa.','Correta: acompanhamento e reorientação são características centrais.','A avaliação subsidia o planejamento, não o substitui.','A avaliação formativa ocorre ao longo do processo.']},
{subject:'Conhecimentos Pedagógicos',topic:'Educação inclusiva',text:'Uma prática coerente com a educação inclusiva deve:',options:['exigir que todos aprendam do mesmo modo e no mesmo ritmo.','separar automaticamente estudantes com deficiência das atividades coletivas.','identificar barreiras e oferecer recursos e estratégias para participação e aprendizagem.','reduzir as oportunidades de participação do estudante.'],answer:'C',comment:'A inclusão busca remover barreiras, garantir acessibilidade, participação e aprendizagem, considerando necessidades e potencialidades individuais.',optionExplanations:['A igualdade de direitos não exige uniformidade de estratégias.','A segregação automática contraria a perspectiva inclusiva.','Correta: identifica barreiras e organiza apoios.','A inclusão amplia oportunidades de participação.']},
// CONHECIMENTOS ESPECÍFICOS (10)
{subject:'Conhecimentos Específicos',topic:'Fundamentos da Educação Infantil',text:'Na concepção contemporânea de Educação Infantil, a criança deve ser compreendida como:',options:['receptora passiva de informações.','sujeito histórico e de direitos, que produz cultura nas interações e brincadeiras.','adulto em miniatura, sem características próprias.','indivíduo que só aprende quando inicia a alfabetização formal.'],answer:'B',comment:'As DCNEI reconhecem a criança como sujeito histórico e de direitos que, nas interações, relações e práticas cotidianas, constrói sua identidade e produz cultura.',optionExplanations:['A criança participa ativamente da construção de conhecimentos.','Correta: corresponde à concepção expressa nas diretrizes curriculares.','A infância possui especificidades e não deve ser tratada como vida adulta reduzida.','A aprendizagem e o desenvolvimento começam muito antes da alfabetização formal.']},
{subject:'Conhecimentos Específicos',topic:'Cuidar e educar',text:'Na Educação Infantil, a relação entre cuidar e educar deve ser entendida como:',options:['duas funções separadas, realizadas em horários sem relação.','uma dimensão indissociável do trabalho pedagógico.','responsabilidade exclusiva da família.','atividade sem intencionalidade educativa.'],answer:'B',comment:'Cuidar e educar são dimensões integradas. Momentos de alimentação, higiene, acolhimento e repouso também envolvem vínculo, aprendizagem, autonomia e desenvolvimento.',optionExplanations:['A rotina deve integrar as dimensões de cuidado e educação.','Correta: cuidar e educar são indissociáveis.','A instituição de Educação Infantil também possui responsabilidades de cuidado e educação.','As situações cotidianas podem ter intencionalidade pedagógica.']},
{subject:'Conhecimentos Específicos',topic:'Desenvolvimento infantil',text:'Ao planejar experiências para crianças de 0 a 5 anos, o professor deve considerar que o desenvolvimento:',options:['ocorre de forma idêntica e no mesmo ritmo para todas as crianças.','envolve dimensões físicas, motoras, cognitivas, afetivas, sociais e linguísticas que se relacionam.','depende exclusivamente da maturação biológica.','pode ser avaliado apenas por provas escritas.'],answer:'B',comment:'O desenvolvimento é integral e multidimensional. As dimensões se influenciam mutuamente e são atravessadas pelas experiências, relações e condições de vida.',optionExplanations:['Há ritmos e trajetórias individuais.','Correta: reconhece a integralidade e a interação entre dimensões.','Experiências, cultura e relações também influenciam o desenvolvimento.','A observação, os registros e diferentes situações são mais adequados à faixa etária.']},
{subject:'Conhecimentos Específicos',topic:'Brincar e aprendizagem',text:'Na Educação Infantil, o brincar deve ser valorizado porque:',options:['é apenas um intervalo entre atividades consideradas sérias.','favorece imaginação, interação, expressão, exploração e aprendizagem.','deve ser utilizado somente como recompensa.','impede o desenvolvimento da linguagem.'],answer:'B',comment:'A brincadeira é eixo estruturante das práticas pedagógicas na Educação Infantil e favorece desenvolvimento, aprendizagem, expressão, interação e produção de cultura.',optionExplanations:['Brincar possui valor educativo e não é mero intervalo.','Correta: reúne funções importantes da brincadeira.','Não deve ser reduzido a prêmio ou recompensa.','Brincadeiras simbólicas e coletivas podem ampliar a linguagem.']},
{subject:'Conhecimentos Específicos',topic:'BNCC - direitos de aprendizagem',text:'São direitos de aprendizagem e desenvolvimento na Educação Infantil previstos na BNCC:',options:['memorizar, copiar, repetir, competir, classificar e obedecer.','conviver, brincar, participar, explorar, expressar e conhecer-se.','ler, escrever, calcular, testar, classificar e competir.','ouvir, copiar, decorar, responder, repetir e avaliar.'],answer:'B',comment:'A BNCC estabelece seis direitos: conviver, brincar, participar, explorar, expressar e conhecer-se.',optionExplanations:['Não corresponde ao conjunto de direitos da BNCC.','Correta: apresenta os seis direitos previstos.','Mistura aprendizagens e práticas que não formam a lista oficial.','Não corresponde aos direitos de aprendizagem e desenvolvimento.']},
{subject:'Conhecimentos Específicos',topic:'BNCC - campos de experiências',text:'Qual alternativa apresenta um campo de experiências da BNCC para a Educação Infantil?',options:['O eu, o outro e o nós.','Operações algébricas e funções.','Gramática normativa e análise sintática.','História política e geografia econômica.'],answer:'A',comment:'“O eu, o outro e o nós” é um dos cinco campos de experiências da BNCC para a Educação Infantil.',optionExplanations:['Correta: é um dos cinco campos de experiências.','Não é campo de experiências da Educação Infantil.','Não é campo de experiências da Educação Infantil.','Não é campo de experiências da Educação Infantil.']},
{subject:'Conhecimentos Específicos',topic:'Rotina e acolhimento',text:'Uma rotina adequada na creche e na pré-escola deve:',options:['ser rígida e ignorar necessidades individuais.','organizar tempos e espaços com previsibilidade, flexibilidade e atenção às necessidades das crianças.','eliminar momentos de brincadeira livre.','ser igual em todos os grupos, independentemente da idade.'],answer:'B',comment:'A rotina organiza a vida coletiva e oferece segurança, mas precisa ser flexível para respeitar ritmos, necessidades, interesses e situações imprevistas.',optionExplanations:['Rigidez excessiva desconsidera as crianças e o contexto.','Correta: combina organização, segurança e flexibilidade.','Brincadeiras livres são importantes na Educação Infantil.','A organização deve considerar características e necessidades de cada grupo.']},
{subject:'Conhecimentos Específicos',topic:'Avaliação e registros',text:'Na Educação Infantil, a avaliação do desenvolvimento deve ocorrer principalmente por meio de:',options:['provas classificatórias para retenção.','acompanhamento e registro do desenvolvimento, sem finalidade de promoção ou classificação.','comparação pública entre crianças.','notas baseadas exclusivamente em tarefas escritas.'],answer:'B',comment:'A LDB, art. 31, prevê avaliação mediante acompanhamento e registro do desenvolvimento, sem objetivo de promoção, inclusive para acesso ao Ensino Fundamental.',optionExplanations:['A avaliação não tem finalidade de retenção ou promoção.','Correta: corresponde à orientação legal para a Educação Infantil.','A comparação pública não é prática adequada de avaliação.','A avaliação deve considerar processos e diferentes formas de expressão.']},
{subject:'Conhecimentos Específicos',topic:'Educação inclusiva',text:'Ao receber uma criança com deficiência, a instituição de Educação Infantil deve:',options:['aguardar que a criança se adapte sem oferecer apoio.','impedir sua participação em atividades que exijam adaptações.','planejar acessibilidade, apoios e estratégias para garantir participação e aprendizagem.','transferir toda a responsabilidade de inclusão à família.'],answer:'C',comment:'A educação inclusiva exige identificação e eliminação de barreiras, acessibilidade e apoios necessários para assegurar participação e aprendizagem em condições de equidade.',optionExplanations:['A instituição deve organizar condições de participação desde o início.','As atividades devem ser adaptadas, não usadas para excluir.','Correta: assegura acessibilidade, apoio e participação.','A responsabilidade é institucional e compartilhada, não transferida integralmente à família.']},
{subject:'Conhecimentos Específicos',topic:'Literatura infantil',text:'A contação de histórias na Educação Infantil contribui para:',options:['ampliar repertório linguístico, imaginação, escuta e vínculo com a literatura.','ensinar exclusivamente a decodificação de letras.','substituir todas as demais experiências pedagógicas.','exigir que a criança reproduza literalmente o texto.'],answer:'A',comment:'A literatura amplia experiências estéticas e culturais, vocabulário, imaginação, escuta e formação do leitor. A mediação não deve reduzir a história a exercícios mecânicos.',optionExplanations:['Correta: contempla diferentes contribuições da literatura.','A experiência literária é mais ampla que a decodificação.','A literatura integra o currículo, mas não substitui outras experiências.','A criança pode interpretar, imaginar, comentar e recriar a narrativa.']}
];

function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains(STORE)){let s=d.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});s.createIndex('subject','subject')}if(!d.objectStoreNames.contains(RESULTS))d.createObjectStore(RESULTS,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function all(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(store,obj){return new Promise((res,rej)=>{let t=db.transaction(store,'readwrite'),r=t.objectStore(store).put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(store,id){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function refresh(){questions=await all(STORE);results=await all(RESULTS);render()}
function setTab(t){if(sim&&t!=='practice'&&sim.active&&!confirm('Sair do simulado? O progresso desta tentativa será perdido.'))return;tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){let a=$('#app');if(tab==='home')a.innerHTML=home();if(tab==='questions')a.innerHTML=questionPage();if(tab==='practice')a.innerHTML=practicePage();if(tab==='stats')a.innerHTML=statsPage();if(tab==='settings')a.innerHTML=settingsPage();bind()}
function home(){let total=questions.length,done=results.length,acc=results.length?Math.round(results.reduce((n,r)=>n+r.correct,0)/results.reduce((n,r)=>n+r.total,0)*100):0;return `<div class="card"><div class="between"><b>Prova objetiva · formato do edital</b><span class="pill">40 questões</span></div><p class="muted" style="margin-bottom:0">10 questões por disciplina · 4 alternativas · 100 pontos. Aprovação: mínimo de 50 pontos e sem zerar disciplina.</p></div><div class="grid"><div class="stat"><small>Questões cadastradas</small><strong>${total}</strong></div><div class="stat"><small>Simulados realizados</small><strong>${done}</strong></div><div class="stat"><small>Taxa geral de acerto</small><strong>${acc}%</strong></div><div class="stat"><small>Disciplinas</small><strong>${new Set(questions.map(q=>q.subject)).size}</strong></div></div><div class="card"><h2>Vamos estudar?</h2><p class="muted">O banco inicial já vem com questões autorais comentadas. Você também pode cadastrar suas próprias questões.</p><div class="row"><button data-go="questions">＋ Cadastrar questão</button><button class="secondary" data-go="practice">Iniciar simulado</button></div></div><h3 class="headerline">Atividade recente</h3><div class="card">${results.length?results.slice(-5).reverse().map(r=>`<div class="listitem between"><div><b>${esc(r.label||'Simulado')}</b><br><small>${new Date(r.date).toLocaleDateString('pt-BR')} · ${r.correct}/${r.total} acertos</small></div><b>${Math.round(r.correct/r.total*100)}%</b></div>`).join(''):'<div class="empty">Seus resultados aparecerão aqui após o primeiro simulado.</div>'}</div>`}
function questionPage(){return `<div class="between"><h2>Banco de questões</h2><button id="newq">＋ Nova</button></div><div class="card"><label>Filtrar por disciplina</label><select id="filter"><option value="">Todas as disciplinas</option>${SUBJECTS.map(s=>`<option>${esc(s)}</option>`).join('')}</select><div id="qlist">${questionList('')}</div></div><div class="notice">Banco inicial: 41 questões autorais comentadas (10 em três disciplinas e 11 em Informática). Não são questões oficiais da IDESG. As questões ficam salvas localmente neste iPhone; você pode adicionar, editar, excluir e importar mais questões. Faça backups regularmente na aba Dados.</div>`}
function questionList(f){let arr=questions.filter(q=>!f||q.subject===f);return arr.length?arr.map(q=>`<div class="listitem"><div class="between"><span class="pill">${esc(q.subject)} · ${esc(q.topic||'Geral')}</span><button class="danger" data-del="${q.id}">Excluir</button></div><p>${esc(q.text)}</p><small>Gabarito: ${q.answer} · ${esc(q.options[q.answer.charCodeAt(0)-65]||'')}</small><div class="row" style="margin-top:8px"><button class="secondary" data-edit="${q.id}">Editar</button></div></div>`).join(''):'<div class="empty">Nenhuma questão cadastrada neste filtro.</div>'}
function questionForm(q={}){let opts=q.options||['','','','',''], reasons=q.optionExplanations||['','','',''];return `<div class="card"><h3>${q.id?'Editar questão':'Cadastrar questão'}</h3><form id="qform"><input type="hidden" name="id" value="${q.id||''}"><div class="field"><label>Disciplina *</label><select name="subject" required>${SUBJECTS.map(s=>`<option ${q.subject===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Assunto</label><input name="topic" placeholder="Ex.: Direitos e garantias fundamentais" value="${esc(q.topic||'')}"></div><div class="field"><label>Enunciado *</label><textarea name="text" required placeholder="Digite o enunciado da questão">${esc(q.text||'')}</textarea></div>${['A','B','C','D'].map((x,i)=>`<div class="field"><label>Alternativa ${x} *</label><input name="o${x}" required value="${esc(opts[i]||'')}"><label>Comentário da alternativa ${x} (opcional)</label><textarea name="r${x}" placeholder="Explique por que esta alternativa está certa ou errada" style="min-height:58px">${esc(reasons[i]||'')}</textarea></div>`).join('')}<div class="field"><label>Gabarito *</label><select name="answer">${['A','B','C','D'].map(x=>`<option ${q.answer===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Comentário / resolução</label><textarea name="comment" placeholder="Explique por que a alternativa está correta e, se desejar, por que as demais estão erradas.">${esc(q.comment||'')}</textarea></div><div class="row"><button type="submit">Salvar questão</button><button type="button" class="secondary" id="cancelq">Cancelar</button></div></form></div>`}
function practicePage(){if(sim?.active)return simPage();if(sim?.result)return resultPage();let subjects=SUBJECTS;return `<h2>Novo simulado</h2><div class="card"><div class="field"><label>Tipo de simulado</label><select id="simtype"><option value="exam">Prova completa no padrão do edital (40 questões)</option><option value="custom">Treino por disciplina / quantidade livre</option></select></div><div id="customfields" class="hidden"><div class="field"><label>Disciplina</label><select id="simsubject"><option value="">Todas as disciplinas</option>${subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Quantidade de questões</label><input id="simcount" type="number" min="1" max="200" value="20"></div></div><div class="field"><label>Tempo (minutos; 0 = sem limite)</label><input id="simtime" type="number" min="0" value="180"></div><p class="notice">A prova oficial tem 10 questões em cada disciplina, com pesos diferentes. Para iniciar a prova completa, o banco precisa ter pelo menos 10 questões cadastradas em cada disciplina.</p><button id="startsim" ${questions.length?'':'disabled'}>Iniciar simulado</button>${questions.length?'':`<p class="muted">Cadastre questões para começar.</p>`}</div>`}
function simPage(){let q=sim.items[sim.index],done=Object.keys(selected).length,remaining=sim.items.length-done,answer=selected[q.id],isAnswered=!!answer,ok=answer===q.answer,eliminated=eliminatedOptions[q.id]||[];return `<div class="between"><div><small>${esc(sim.label)}</small><h2>Questão ${sim.index+1} de ${sim.items.length}</h2></div><div class="timer" id="clock">${clockText()}</div></div><div class="progress"><span style="width:${(sim.index+1)/sim.items.length*100}%"></span></div><div class="card"><span class="pill">${esc(q.subject)} · ${esc(q.topic||'Geral')}</span><p class="qtitle">${esc(q.text)}</p><p class="notice">Use “Eliminar” para riscar uma alternativa. Você pode restaurá-la ou mudar sua resposta antes de avançar.</p>${q.options.map((o,i)=>{let k='ABCD'[i],gone=eliminated.includes(k),chosen=answer===k,cls=gone?'eliminated':chosen?(isAnswered?(ok?'correct':'wrong'):'selected'):'';return `<div><button class="choice ${cls}" data-answer="${k}" ${gone?'disabled':''}>${k}) ${esc(o)}</button><button class="${gone?'restore':'eliminate'}" data-eliminate="${k}">${gone?'↶ Restaurar':'⊖ Eliminar'}</button></div>${isAnswered?`<div class="rationale"><b>${k}:</b> ${esc((q.optionExplanations||[])[i]|| (k===q.answer?'Esta é a alternativa indicada no gabarito.':'Não há justificativa individual cadastrada para esta alternativa. Consulte o comentário geral abaixo.'))}</div>`:''}`}).join('')}${isAnswered?`<div class="feedback"><b style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Resposta correta!':'Resposta incorreta.'}</b><br><b>Gabarito: ${q.answer}.</b>${q.comment?`<br><br><b>Explicação:</b><br>${esc(q.comment)}`:'<br><br><span class="notice">Ainda não há comentário geral cadastrado. Ao cadastrar esta questão, inclua a fundamentação para receber uma explicação completa.</span>'}</div>`:''}<div class="between" style="margin-top:16px"><button class="secondary" id="prev" ${sim.index===0?'disabled':''}>Anterior</button><small>${done} respondidas · ${remaining} pendentes</small><button id="next">${sim.index===sim.items.length-1?'Finalizar':'Próxima'}</button></div></div><button class="danger" id="quit">Encerrar sem salvar</button>`}
function clockText(){let s=elapsed;return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function startClock(){clearInterval(tick);tick=setInterval(()=>{elapsed++;let el=$('#clock');if(el)el.textContent=clockText();if(sim?.limit&&elapsed>=sim.limit*60){clearInterval(tick);finishSim(true)}},1000)}
async function finishSim(timeout=false){clearInterval(tick);let correct=0,score=0,answers={},bySubject={};SUBJECTS.forEach(s=>bySubject[s]={correct:0,total:0,points:0});sim.items.forEach(q=>{let a=selected[q.id]||null;answers[q.id]=a;let ok=a===q.answer;if(ok){correct++;score+=sim.type==='exam'?WEIGHTS[q.subject]:1;bySubject[q.subject].correct++;bySubject[q.subject].points+=sim.type==='exam'?WEIGHTS[q.subject]:1}bySubject[q.subject].total++});let result={label:sim.label||'Simulado',type:sim.type||'custom',date:new Date().toISOString(),total:sim.items.length,correct,score,bySubject,elapsed,answers,items:sim.items.map(q=>q.id)};await put(RESULTS,result);let missed=sim.items.filter(q=>selected[q.id]!==q.answer);sim={active:false,result,missed,items:sim.items};tab='practice';render();}
function resultPage(){let r=sim.result;let exam=r.type==='exam';let passed=exam&&r.score>=50&&SUBJECTS.every(s=>(r.bySubject[s]?.correct||0)>0);return `<div class="card" style="text-align:center"><small>RESULTADO DO SIMULADO</small><h1 style="font-size:42px;color:var(--blue);margin:8px">${exam?r.score.toFixed(1).replace('.',',')+' / 100':Math.round(r.correct/r.total*100)+'%'}</h1><b>${r.correct} acertos de ${r.total} questões</b>${exam?`<p><b style="color:${passed?'var(--green)':'var(--red)'}">${passed?'Atingiu os critérios mínimos do edital':'Não atingiu os critérios mínimos do edital'}</b></p><div class="notice">Critérios: pelo menos 50 pontos e pelo menos 1 acerto em cada disciplina.</div><div style="text-align:left;margin-top:12px">${SUBJECTS.map(s=>`<div class="listitem between"><span>${s}</span><b>${r.bySubject[s].correct}/10 · ${r.bySubject[s].points.toFixed(1).replace('.',',')} pts</b></div>`).join('')}</div>`:''}<p class="muted">Tempo: ${Math.floor(r.elapsed/60)} min ${r.elapsed%60} s</p></div><h3>Correção comentada</h3>${sim.items.map((q,i)=>{let a=r.answers[q.id],ok=a===q.answer;return `<div class="card"><div class="between"><b>Questão ${i+1}</b><span class="pill" style="color:${ok?'var(--green)':'var(--red)'}">${ok?'Acertou':'Errou / em branco'}</span></div><p>${esc(q.text)}</p><p><b>Sua resposta:</b> ${a||'Em branco'} · <b>Gabarito:</b> ${q.answer}</p>${q.comment?`<div class="feedback"><b>Explicação:</b><br>${esc(q.comment)}</div>`:'<p class="notice">Sem comentário geral cadastrado.</p>'}${q.options.map((o,j)=>`<div class="rationale"><b>${'ABCD'[j]} — ${'ABCD'[j]===q.answer?'Correta':'Incorreta'}:</b> ${esc((q.optionExplanations||[])[j]||'Justificativa individual não cadastrada.')}</div>`).join('')}</div>`}).join('')}<button id="again">Novo simulado</button>`}
function statsPage(){let total=results.reduce((s,r)=>s+r.total,0),correct=results.reduce((s,r)=>s+r.correct,0),by={};results.forEach(r=>{let pct=r.total?r.correct/r.total*100:0;by[r.label||'Simulado']={pct,date:r.date}});let recent=results.slice(-8);return `<h2>Desempenho</h2><div class="grid"><div class="stat"><small>Questões respondidas</small><strong>${total}</strong></div><div class="stat"><small>Acertos</small><strong>${correct}</strong></div><div class="stat"><small>Erros / em branco</small><strong>${total-correct}</strong></div><div class="stat"><small>Aproveitamento</small><strong>${total?Math.round(correct/total*100):0}%</strong></div></div><div class="card"><h3>Evolução dos últimos simulados</h3>${recent.length?`<div class="chart">${recent.map(r=>`<div class="bar" style="height:${Math.max(4,r.correct/r.total*100)}%"><span>${Math.round(r.correct/r.total*100)}%</span></div>`).join('')}</div><div style="height:24px"></div>`:'<div class="empty">Realize simulados para gerar seu gráfico.</div>'}</div><div class="card"><h3>Histórico</h3>${results.length?results.slice().reverse().map(r=>`<div class="listitem between"><div><b>${esc(r.label)}</b><br><small>${new Date(r.date).toLocaleString('pt-BR')} · ${r.correct}/${r.total}</small></div><b>${Math.round(r.correct/r.total*100)}%</b></div>`).join(''):'<div class="empty">Nenhum simulado realizado.</div>'}</div>`}
function settingsPage(){return `<h2>Dados e backup</h2><div class="card"><h3>Exportar backup</h3><p class="muted">Salva suas questões e resultados em um arquivo JSON. Guarde esse arquivo em local seguro.</p><button id="export">Exportar meus dados</button></div><div class="card"><h3>Restaurar backup</h3><p class="muted">Importa um backup JSON. Questões e resultados existentes serão mantidos; os registros importados serão acrescentados.</p><input id="importfile" type="file" accept="application/json"><button id="import">Importar backup</button></div><div class="card"><h3>Sobre o aplicativo</h3><p>Versão 0.4 · Concurso Muqui/ES · Professor de Educação Infantil · IDESG.</p><p class="notice">Banco inicial com 41 questões autorais comentadas (10 em três disciplinas e 11 em Informática). Prova objetiva: 40 questões, 4 alternativas; Português (10 × 2,5), Informática (10 × 2,0), Conhecimentos Pedagógicos (10 × 2,5) e Conhecimentos Específicos (10 × 3,0).</p><p class="notice">Atenção: limpar os dados do navegador ou remover os dados do site pode apagar questões e resultados. Exporte backups regularmente.</p></div>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));let n=$('#newq');if(n)n.onclick=()=>{$('#app').innerHTML=questionForm();bindForm()};let f=$('#filter');if(f)f.onchange=()=>$('#qlist').innerHTML=questionList(f.value);document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir esta questão?')){await del(STORE,+b.dataset.del);await refresh()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('#app').innerHTML=questionForm(questions.find(q=>q.id===+b.dataset.edit));bindForm()});let st=$('#simtype');if(st)st.onchange=()=>$('#customfields').classList.toggle('hidden',st.value!=='custom');let s=$('#startsim');if(s)s.onclick=()=>{let type=$('#simtype').value,subject=type==='custom'?$('#simsubject').value:'',arr=[],label='';if(type==='exam'){let missing=SUBJECTS.filter(sub=>questions.filter(q=>q.subject===sub).length<10);if(missing.length){alert('Para a prova completa, cadastre pelo menos 10 questões em cada disciplina. Faltam: '+missing.join(', '));return}SUBJECTS.forEach(sub=>arr.push(...questions.filter(q=>q.subject===sub).sort(()=>Math.random()-.5).slice(0,10)));arr.sort(()=>Math.random()-.5);label='Prova completa · Edital Muqui 001/2026'}else{let pool=questions.filter(q=>!subject||q.subject===subject).sort(()=>Math.random()-.5),count=Math.max(1,Math.min(200,+$('#simcount').value||20,pool.length));arr=pool.slice(0,count);label='Treino personalizado'}if(!arr.length)return;sim={active:true,type,label,items:arr,index:0,limit:+$('#simtime').value||0};selected={};eliminatedOptions={};elapsed=0;startClock();render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let id=sim.items[sim.index].id;if((eliminatedOptions[id]||[]).includes(b.dataset.answer))return;selected[id]=b.dataset.answer;render()});document.querySelectorAll('[data-eliminate]').forEach(b=>b.onclick=()=>{let id=sim.items[sim.index].id,k=b.dataset.eliminate,arr=eliminatedOptions[id]||[];eliminatedOptions[id]=arr.includes(k)?arr.filter(x=>x!==k):[...arr,k];if(selected[id]===k)delete selected[id];render()});let nx=$('#next');if(nx)nx.onclick=()=>{if(sim.index===sim.items.length-1){if(confirm('Finalizar e corrigir o simulado?'))finishSim()}else{sim.index++;render()}};let pv=$('#prev');if(pv)pv.onclick=()=>{sim.index--;render()};let qt=$('#quit');if(qt)qt.onclick=()=>{if(confirm('Encerrar sem salvar o resultado?')){clearInterval(tick);sim=null;render()}};let ag=$('#again');if(ag)ag.onclick=()=>{sim=null;setTab('practice')};let ex=$('#export');if(ex)ex.onclick=async()=>{let data={app:'Meu Simulado',version:1,exportedAt:new Date().toISOString(),questions,results};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='backup-meu-simulado.json';a.click();URL.revokeObjectURL(url)};let im=$('#import');if(im)im.onclick=async()=>{let file=$('#importfile').files[0];if(!file)return alert('Selecione um arquivo JSON.');try{let data=JSON.parse(await file.text());if(!Array.isArray(data.questions)||!Array.isArray(data.results))throw Error();for(let q of data.questions){let {id,...copy}=q;await put(STORE,copy)}for(let r of data.results){let {id,...copy}=r;await put(RESULTS,copy)}await refresh();alert('Backup importado.')}catch(e){alert('Não foi possível importar: arquivo inválido.')}}}
function bindForm(){let form=$('#qform');form.onsubmit=async e=>{e.preventDefault();let d=new FormData(form),id=d.get('id'),q={subject:d.get('subject').trim(),topic:d.get('topic').trim(),text:d.get('text').trim(),options:['A','B','C','D'].map(x=>d.get('o'+x).trim()),answer:d.get('answer'),comment:d.get('comment').trim(),optionExplanations:['A','B','C','D'].map(x=>d.get('r'+x).trim())};if(id)q.id=+id;await put(STORE,q);await refresh()};$('#cancelq').onclick=()=>render()}
(async()=>{try{db=await openDB();let existing=await all(STORE);if(!existing.some(q=>q.origin==='Banco inicial v0.4')){for(const q of INITIAL_QUESTIONS)await put(STORE,{...q,origin:'Banco inicial v0.4'})}await refresh();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#app').innerHTML='<div class="card">Não foi possível abrir o banco de dados neste navegador. Abra o aplicativo em uma página HTTPS pelo Safari.</div>'}})();
</script></body></html>
